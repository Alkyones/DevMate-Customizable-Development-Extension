<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/link.css">
</head>
<body>
  <div id="popup-content">
    <div class="top-header">
    <button id="sideMenuToggle" class="side-toggle" title="Hide" aria-label="Toggle side menu">
      <svg class="hamburger-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="3" y1="7" x2="21" y2="7" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="17" x2="21" y2="17" /></svg>
    </button>
    <div class="top-title"><h2 class="devmate-title">DevMate AI</h2></div>
  </div>
  <div class="popup-layout">
    <aside class="side-menu" id="sideMenu">
  <div class="button-container">
        <button id="checkButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>
        </span><span class="btn-label">Local Storage</span></button>

        <button id="showLinksButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M10 14a5 5 0 007.07 0l1.41-1.41a5 5 0 00-7.07-7.07L9.93 6.93"/><path d="M14 10a5 5 0 00-7.07 0L5.52 11.41a5 5 0 007.07 7.07L14 16.07"/></svg>
        </span><span class="btn-label">Useful Links</span></button>

        <button id="fetchesButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 2v6"/><path d="M12 16v6"/><path d="M5 7l7 5 7-5"/></svg>
        </span><span class="btn-label">Fetches</span></button>

        <button id="credentialsButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span><span class="btn-label">Credentials</span></button>

        <button id="generateCredentialsButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/><path d="M2 22l4-4"/></svg>
        </span><span class="btn-label">Generator</span></button>

        <button id="codeKeeperButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
        </span><span class="btn-label">Code Keeper</span></button>

        <button id="pingerButton"><span class="btn-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </span><span class="btn-label">Pinger</span></button>
      </div>
    </aside>

    <main class="main-content">
  <div id="links" class= 'input-container' hidden>
    <div class="input-row">
      <input type="text" placeholder="Link name" id="linkKeyInput">
      <input type="text" placeholder="Link URL" id="linkValueInput">
      <button id="saveLinkButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 007.07 0l1.41-1.41a5 5 0 00-7.07-7.07L9.93 6.93"/><path d="M14 10a5 5 0 00-7.07 0L5.52 11.41a5 5 0 007.07 7.07L14 16.07"/></svg>
        </span>Add Link</button>
      <button id="saveCurrentLinkButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </span>Save Current</button>
    </div>
    <ul id="usefulLinks"></ul>
  </div>
  <div id="credentials" class="input-container" hidden>
    <div class="input-row">
      <input type="text" placeholder="Website" id="credentialsWebsiteInput">
      <input type="text" placeholder="Username" id="credentialsKeyInput">
      <input type="text" placeholder="Password" id="credentialsValueInput">
      <button id="saveCredentialButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>Save</button>
    </div>
    <ul id="credentialsList"></ul>
  </div>
  <div id="generate-credentials" class="input-container" hidden>
      <div class="input-row">
      <button id="generateUsernameButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>Username</button>
      <button id="generatePasswordButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-7 7"/><circle cx="7" cy="14" r="3"/><path d="M10 14h11"/></svg>
        </span>Password</button>
      <button id="generateEmailButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9 6 9-6"/><path d="M21 19H3V5h18z"/></svg>
        </span>Email</button>
    </div>
    <div id="generatedResult"></div>
  </div>
  <div id="code-keeper" class="input-container" hidden>
    <div class="collapsible-header" id="codeKeeperFormToggle">
      <span class="collapsible-title">
        <svg class="collapsible-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New Snippet
      </span>
      <svg class="collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="collapsible-content" id="codeKeeperFormContent">
      <input type="text" placeholder="Snippet title" id="codeTitleInput">
      <div class="code-keeper-textarea-wrapper">
        <textarea id="codeTextarea" placeholder="Paste your code snippet here..."></textarea>
      </div>
      <div class="code-keeper-actions">
        <button id="saveSnippetButton"><span class="action-icon" aria-hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/></svg>
          </span>Save Snippet</button>
        <div id="snippetStatus"></div>
      </div>
    </div>
    <ul id="codeSnippetList"></ul>
  </div>
  <div id="pinger" class="input-container" hidden>
    <div class="collapsible-header" id="pingerFormToggle">
      <span class="collapsible-title">
        <svg class="collapsible-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New Ping Request
      </span>
      <svg class="collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="collapsible-content" id="pingerFormContent">
      <div class="input-row">
        <input type="text" placeholder="Request name" id="pingerNameInput">
        <select id="pingerMethodSelect">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
      </div>
      <div class="input-row">
        <input type="url" placeholder="Request URL" id="pingerUrlInput">
      </div>
      <div class="input-row">
        <textarea id="pingerHeadersInput" placeholder='Headers (JSON format, e.g. {"Content-Type": "application/json"})'></textarea>
      </div>
      <div class="input-row">
        <textarea id="pingerBodyInput" placeholder="Request body (for POST/PUT requests)"></textarea>
      </div>
      <div class="input-row">
        <input type="number" placeholder="Interval (sec)" id="pingerIntervalInput" min="1" max="3600" value="60">
        <button id="savePingerButton"><span class="action-icon" aria-hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/></svg>
          </span>Save Pinger</button>
      </div>
      <div id="pingerStatus"></div>
    </div>
    <ul id="pingerList"></ul>
  </div>
  <div id="fetch-requests" hidden>
    <div class="capture-controls">
      <label><input type="checkbox" id="captureToggle"> Capture requests</label>
      <button id="clearCapturedButton"><span class="action-icon" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6v12"/><path d="M16 6v12"/><path d="M10 2h4l1 4H9z"/></svg>
        </span>Clear</button>
    </div>
    <ul id="fetchRequestList"></ul>
    <div id="replayResult"></div>
  </div>
  <div id="result"></div>
  <div id="copied"></div>
    </main>
    </div>
  </div>
  <script src="scripts/popup.js" type="module"></script>
</body>
</html>
